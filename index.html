<!DOCTYPE html>
<html>
<head>
    <title>Homework Practice App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <div id="task-selection-screen">
            <h2>Select a Task</h2>
            <button id="multiplication-btn">Practice Multiplication</button>
            <button id="addition-btn">Practice Addition</button>
        </div>

        <div id="quiz-screen" class="hidden">
            <div id="question-text"></div>
            <div id="timer-display"></div>
            <div id="answer-choices">
                <!-- Buttons will be added here by JavaScript -->
            </div>
            <div id="feedback-area"></div>
        </div>

        <div id="score-screen" class="hidden">
            <h2>Quiz Complete!</h2>
            <div id="total-score"></div>
            <button id="home-btn">Return to Main Screen</button>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
